<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Tags</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin: 0; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .label { font-family: var(--font-ui); font-size: 11px; color: var(--fg-muted); min-width: 80px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../../ui_kits/app/Primitives.jsx"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(
  <>
    <div className="row"><span className="label">neutral</span>
      <Tag>Cash secured</Tag><Tag>Covered</Tag><Tag>2026/02/19</Tag><Tag>12%</Tag>
    </div>
    <div className="row"><span className="label">accent</span>
      <Tag tone="accent">Calls ↗</Tag><Tag tone="accent">Sold</Tag><Tag tone="accent">+2.4%</Tag>
    </div>
    <div className="row"><span className="label">muted</span>
      <Tag tone="muted">Expired</Tag><Tag tone="muted">Pending</Tag>
    </div>
  </>
);
</script>
</body>
</html>
