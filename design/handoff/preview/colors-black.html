<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Colors — Primitives</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw {
    border: 1px solid var(--border);
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 100px;
  }
  .chip { width: 100%; height: 40px; border: 1px solid var(--border); }
  .name { font-family: var(--font-mono); font-size: 12px; color: var(--fg); }
  .hex  { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
  .section-label {
    font-family: var(--font-ui); font-size: 12px; color: var(--fg-muted);
    margin: 2px 0 8px; text-transform: none;
  }
</style>
</head>
<body>
  <div class="section-label">Black</div>
  <div class="row" style="grid-template-columns: repeat(6, 1fr);">
    <div class="sw"><div class="chip" style="background:#121212"></div><div class="name">black-100</div><div class="hex">#121212</div></div>
    <div class="sw"><div class="chip" style="background:rgba(18,18,18,0.8)"></div><div class="name">black-150</div><div class="hex">#121212 / 80%</div></div>
    <div class="sw"><div class="chip" style="background:rgba(18,18,18,0.01)"></div><div class="name">black-200</div><div class="hex">#121212 / 1%</div></div>
    <div class="sw"><div class="chip" style="background:#282828"></div><div class="name">black-300</div><div class="hex">#282828</div></div>
    <div class="sw"><div class="chip" style="background:rgba(40,40,40,0.8)"></div><div class="name">black-400</div><div class="hex">#282828 / 80%</div></div>
    <div class="sw"><div class="chip" style="background:#8A8A8A"></div><div class="name">black-500</div><div class="hex">#8A8A8A</div></div>
  </div>
</body>
</html>
