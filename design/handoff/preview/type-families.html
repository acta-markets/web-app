<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Type — Families</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { border: 1px solid var(--border); padding: 18px; }
  .meta { font-family: var(--font-ui); font-size: 11px; color: var(--fg-muted); letter-spacing: -0.01em; margin-bottom: 10px; }
  .glyph { font-size: 56px; line-height: 1; letter-spacing: -0.02em; color: var(--fg); }
  .sample { margin-top: 10px; color: var(--fg); }
  .samples { display: flex; gap: 16px; font-size: 14px; }
  .samples span { color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="meta">Display · Space Grotesk SemiBold</div>
    <div class="glyph h-2">Ag 0%</div>
    <div class="samples mono-sm"><span>400</span><span>500</span><span>600</span><span>700</span></div>
  </div>
  <div class="card">
    <div class="meta">Mono · JetBrains Mono</div>
    <div class="glyph" style="font-family:var(--font-mono);font-weight:500">Ag 0%</div>
    <div class="samples mono-sm"><span>400</span><span>500</span><span>700</span></div>
  </div>
  <div class="card" style="grid-column: span 2;">
    <div class="meta">UI · Geist Medium · used sparingly for neutral UI labels</div>
    <div class="glyph" style="font-family:var(--font-ui);font-weight:500">Ag 0%</div>
  </div>
</body>
</html>
