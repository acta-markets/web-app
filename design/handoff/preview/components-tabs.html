<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Tabs</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin: 0; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .label { font-family: var(--font-ui); font-size: 11px; color: var(--fg-muted); min-width: 80px; }
  .row { display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../../ui_kits/app/Primitives.jsx"></script>
<script type="text/babel">
function App() {
  const [a, setA] = React.useState('earn');
  const [b, setB] = React.useState('call');
  const [c, setC] = React.useState('deposit');
  return (
    <>
      <div className="row"><span className="label">nav</span>
        <Tabs value={a} onChange={setA} options={[
          { value:'earn', label:'Earn' }, { value:'markets', label:'Markets' }, { value:'portfolio', label:'Portfolio' },
        ]}/>
      </div>
      <div className="row"><span className="label">filter</span>
        <Tabs value={b} onChange={setB} options={[
          { value:'call', label:'Call' }, { value:'put', label:'Put' }, { value:'all', label:'All' },
        ]}/>
      </div>
      <div className="row"><span className="label">deposit</span>
        <div style={{width: 360}}>
          <Tabs variant="deposit" value={c} onChange={setC} options={[
            { value:'deposit', label:'Deposit' }, { value:'withdraw', label:'Withdraw' },
          ]}/>
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
