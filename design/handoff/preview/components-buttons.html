<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { margin: 0; padding: 24px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .label { font-family: var(--font-ui); font-size: 11px; color: var(--fg-muted); min-width: 80px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../../ui_kits/app/Primitives.jsx"></script>
<script type="text/babel">
function Preview() {
  return (
    <div className="col">
      <div className="row"><span className="label">primary</span>
        <Button variant="primary">Connect</Button>
        <Button variant="primary" state="hover">Hover</Button>
        <Button variant="primary" size="lg">Deposit</Button>
        <Button variant="primary" state="disabled">Disabled</Button>
      </div>
      <div className="row"><span className="label">secondary</span>
        <Button variant="secondary">Open market</Button>
        <Button variant="secondary" icon={<ChevronRightDuo size={14} stroke="#F0F0F0" style={{marginLeft:4}}/>}>Next</Button>
        <Button variant="outline">Cancel</Button>
      </div>
      <div className="row"><span className="label">accent</span>
        <Button variant="accent">Calls ↗</Button>
        <Button variant="accent">Puts ↘</Button>
      </div>
      <div className="row"><span className="label">ghost</span>
        <Button variant="ghost" state="active">Earn</Button>
        <Button variant="ghost">Portfolio</Button>
        <Button variant="ghost">How it works »</Button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Preview/>);
</script>
</body>
</html>
