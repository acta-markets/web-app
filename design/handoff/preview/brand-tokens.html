<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Token marks</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px; border: 1px solid var(--border); }
  .circle { width: 44px; height: 44px; border-radius: 999px; background: #F0F0F0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: var(--font-display); font-weight: 600; color: #121212; font-size: 16px; }
  .n { font-family: var(--font-mono); font-size: 11px; color: var(--fg); }
  .s { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
  .btc { position: relative; width: 44px; height: 44px; border-radius: 999px; background: #FF611B; display:flex; align-items:center; justify-content:center; color:#F0F0F0; font-family: var(--font-display); font-weight: 700; font-size: 18px; }
  .jlp { background: conic-gradient(from 200deg, #2AA286, #80C9B6, #2AA286 75%, #0A4A3C); color:#F0F0F0; }
</style>
</head>
<body>
  <div class="cell"><div class="circle">jitoSOL</div><div class="n">jitoSOL</div><div class="s">placeholder</div></div>
  <div class="cell"><div class="circle jlp" style="color:#F0F0F0;font-size:12px">JLP</div><div class="n">JLP</div><div class="s">placeholder</div></div>
  <div class="cell"><div class="btc">₿</div><div class="n">BTC</div><div class="s">#FF611B</div></div>
  <div class="cell"><div class="circle" style="background:#14131F;color:#F0F0F0">SOL</div><div class="n">SOL</div><div class="s">placeholder</div></div>
  <div class="cell"><div class="circle" style="background:#2775CA;color:#F0F0F0">$</div><div class="n">USDC</div><div class="s">placeholder</div></div>
  <div class="cell"><div class="circle" style="background:#F0F0F0"></div><div class="n">default</div><div class="s">40×40 / 999px</div></div>
</body>
</html>
