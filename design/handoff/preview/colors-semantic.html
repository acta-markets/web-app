<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Semantic colors</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { border: 1px solid var(--border); padding: 14px; }
  .tile .kind { font-family: var(--font-ui); font-size: 12px; color: var(--fg-muted); margin-bottom:6px; }
  .tile .demo { height: 52px; display:flex; align-items:center; justify-content:center;
                font-family: var(--font-mono); font-size: 13px; border: 1px solid var(--border); }
  .tile .token { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); margin-top:8px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="tile"><div class="kind">fg</div><div class="demo" style="background:#121212;color:#F0F0F0">Sample</div><div class="token">--fg · #F0F0F0</div></div>
    <div class="tile"><div class="kind">fg-muted</div><div class="demo" style="background:#121212;color:#8A8A8A">Sample</div><div class="token">--fg-muted · #8A8A8A</div></div>
    <div class="tile"><div class="kind">accent</div><div class="demo" style="background:#2AA286;color:#F0F0F0">Connect</div><div class="token">--accent · #2AA286</div></div>
    <div class="tile"><div class="kind">accent-tint</div><div class="demo" style="background:rgba(42,162,134,0.2);color:#80C9B6;border-color:#2AA286">Calls ↗</div><div class="token">--accent-tint + accent fg</div></div>
    <div class="tile"><div class="kind">border</div><div class="demo" style="background:#121212;border-color:#282828">—</div><div class="token">--border · #282828</div></div>
    <div class="tile"><div class="kind">bg-glass</div><div class="demo" style="background:rgba(18,18,18,0.5);backdrop-filter:blur(8px)">glass</div><div class="token">--bg-glass + blur 8–16</div></div>
    <div class="tile"><div class="kind">bg-scrolled</div><div class="demo" style="background:rgba(18,18,18,0.8);backdrop-filter:blur(12px)">header</div><div class="token">--bg-scrolled</div></div>
    <div class="tile"><div class="kind">accent-dark</div><div class="demo" style="background:#078568;color:#F0F0F0">Deposit</div><div class="token">--accent-dark · #078568</div></div>
  </div>
</body>
</html>
