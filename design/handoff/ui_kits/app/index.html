<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Acta — App</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>html,body,#root{min-height:100vh}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./Primitives.jsx"></script>
<script type="text/babel" src="./Layout.jsx"></script>
<script type="text/babel" src="./Markets.jsx"></script>
<script type="text/babel">
function App() {
  const [page, setPage] = React.useState('earn');
  const [connected, setConnected] = React.useState(false);
  const [strategy, setStrategy] = React.useState('call');
  const [openMarket, setOpenMarket] = React.useState(null);
  const [toast, setToast] = React.useState(null);
  const [scrolled, setScrolled] = React.useState(false);

  React.useEffect(() => {
    const on = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', on);
    return () => window.removeEventListener('scroll', on);
  }, []);

  const callMarkets = [
    { symbol:'jitoSOL', type:'Call', minApr:'12%', maxApr:'34%', capFilled:54, apr:'12%–34%' },
    { symbol:'JLP',     type:'Call', minApr:'9%',  maxApr:'28%', capFilled:41, apr:'9%–28%' },
    { symbol:'BTC',     type:'Call', minApr:'14%', maxApr:'41%', capFilled:31, apr:'14%–41%' },
    { symbol:'SOL',     type:'Call', minApr:'11%', maxApr:'36%', capFilled:68, apr:'11%–36%' },
  ];
  const putMarkets = [
    { symbol:'USDC', type:'Put', minApr:'8%',  maxApr:'22%', capFilled:78, apr:'8%–22%' },
    { symbol:'USDC', type:'Put', minApr:'10%', maxApr:'26%', capFilled:45, apr:'10%–26%' },
    { symbol:'USDC', type:'Put', minApr:'7%',  maxApr:'19%', capFilled:22, apr:'7%–19%' },
    { symbol:'USDC', type:'Put', minApr:'9%',  maxApr:'24%', capFilled:63, apr:'9%–24%' },
  ];
  const popular = strategy === 'call' ? callMarkets : putMarkets;
  const allRows = [...callMarkets, ...putMarkets];

  return (
    <div data-screen-label={`Acta / ${page}`}>
      <Header page={page} onPage={setPage} connected={connected}
        onConnect={() => { setConnected(true); setToast('Wallet connected'); }}
        scrolled={scrolled}/>

      {page === 'earn' && (
        <>
          <Hero/>
          <StrategyTiles value={strategy} onChange={setStrategy}/>

          <div style={{ maxWidth: 1320, margin: '0 auto', padding: '0 40px' }}>
            <SectionTitle>Popular markets</SectionTitle>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
              {popular.map((m, i) => (
                <MarketCard key={i} {...m} onOpen={() => setOpenMarket(m)}/>
              ))}
            </div>

            <SectionTitle>All markets</SectionTitle>
            <MarketsTable rows={allRows} onOpen={setOpenMarket}/>
          </div>

          <Footer/>
        </>
      )}

      {page === 'markets' && (
        <div style={{ maxWidth: 1320, margin: '0 auto', padding: '40px' }}>
          <SectionTitle>All markets</SectionTitle>
          <MarketsTable rows={allRows} onOpen={setOpenMarket}/>
          <Footer/>
        </div>
      )}

      {page === 'portfolio' && (
        <div style={{ maxWidth: 1320, margin: '0 auto', padding: '40px' }}>
          <SectionTitle>Your portfolio</SectionTitle>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 24 }}>
            <InfoBox header="Total value"   value="$42,318.00" sub="+2.4%" subMuted="24h"/>
            <InfoBox header="Open positions" value="6"/>
            <InfoBox header="Total premium" value="$1,208.42" sub="lifetime"/>
            <InfoBox header="Next maturity" value="2026/02/19" sub="28d" subMuted="remaining"/>
          </div>
          <MarketsTable rows={[
            { symbol:'jitoSOL', type:'Call', minApr:'24%', maxApr:'—', capFilled:100, apr:'24%' },
            { symbol:'BTC',     type:'Call', minApr:'18%', maxApr:'—', capFilled:100, apr:'18%' },
            { symbol:'USDC',    type:'Put',  minApr:'14%', maxApr:'—', capFilled:100, apr:'14%' },
          ]} onOpen={setOpenMarket}/>
          <Footer/>
        </div>
      )}

      {openMarket && (
        <DepositSheet market={openMarket}
          onClose={() => setOpenMarket(null)}
          onConfirm={() => { setOpenMarket(null); setToast('Deposit confirmed'); }}/>
      )}
      {toast && <Toast message={toast} onDone={() => setToast(null)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
