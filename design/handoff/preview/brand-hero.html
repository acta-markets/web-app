<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Hero composite</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 0; background: #000; }
  .stage { position: relative; width: 100%; height: 280px; overflow: hidden; background: #121212; }
  .noise {
    position: absolute; inset: -10% -10% -10% -10%;
    background: url(../assets/hero-texture.png) center/cover no-repeat;
    opacity: 0.24; mix-blend-mode: hard-light;
    filter: grayscale(1) contrast(1.1);
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(240,240,240,0.08) 1px, transparent 1px);
    background-size: 8px 8px;
  }
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .title { font-family: var(--font-display); font-weight: 600; font-size: 80px; line-height: 1; letter-spacing: -0.02em; color: #F0F0F0; }
  .sub { font-family: var(--font-mono); font-size: 14px; color: #8A8A8A; letter-spacing: -0.02em; }
  .link { font-family: var(--font-mono); font-size: 14px; color: #80C9B6; letter-spacing: -0.02em; }
  .meta { position: absolute; left: 16px; bottom: 12px; font-family: var(--font-mono); font-size: 11px; color: rgba(240,240,240,0.4); }
</style>
</head>
<body>
  <div class="stage">
    <div class="dots"></div>
    <div class="noise"></div>
    <div class="content">
      <div class="title">Earn</div>
      <div class="sub">Get instant yield on your assets</div>
      <div class="link">How it works »</div>
    </div>
    <div class="meta">hero-texture.png · hard-light · 24% · over dotted grid</div>
  </div>
</body>
</html>
